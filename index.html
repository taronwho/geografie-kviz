<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hádej místa světa podle nápověd z Wikipedie – každý den nové dnešní místo a k tomu neomezený trénink.">
    <meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Geo Kvíz">

    <title>Geo Kvíz</title>

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="icons.js" defer></script>
    <script src="quiz-core.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body class="font-sans text-slate-800 dark:text-slate-100 h-[100dvh] flex flex-col overflow-hidden">

    <div class="w-full h-full flex flex-col relative shadow-2xl bg-slate-50 dark:bg-slate-900 max-w-md mx-auto border-x border-slate-200 dark:border-slate-800">

        <!-- Hlavička -->
        <div class="absolute top-0 w-full p-4 flex justify-between items-center z-30 pointer-events-none mt-1">
            <div id="status-badge" class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-sm text-sm font-bold text-slate-700 flex items-center gap-2 pointer-events-auto transition-colors border border-slate-200/60 dark:border-slate-700" aria-live="polite">
                <span id="status-icon-slot" class="flex"><i data-lucide="globe-2" class="w-5 h-5 text-emerald-600 dark:text-emerald-400"></i></span>
                <span id="status-text" class="tracking-wide uppercase text-[11px] text-emerald-800 dark:text-emerald-300">Kvízový trénink</span>
            </div>

            <div class="flex gap-2 pointer-events-auto">
                <button id="btn-daily" type="button" class="p-3 rounded-2xl transition-all bg-emerald-600 text-white shadow-md active:scale-95 border border-emerald-500" title="Dnešní místo" aria-label="Dnešní místo">
                    <i data-lucide="calendar-days" class="w-5 h-5"></i>
                </button>
                <button id="btn-random" type="button" class="p-3 rounded-2xl transition-all bg-white/90 text-slate-700 shadow-md active:scale-95 border border-slate-200/60" title="Nové místo (trénink)" aria-label="Nové místo (trénink)">
                    <i data-lucide="shuffle" class="w-5 h-5" id="random-icon"></i>
                </button>
            </div>
        </div>

        <!-- Obsah -->
        <main id="app-content" class="flex-grow flex flex-col relative w-full h-full overflow-y-auto overscroll-y-contain bg-white dark:bg-slate-900">
            <div class="absolute inset-0 z-10 flex flex-col items-center justify-center fade-in bg-slate-50/80 dark:bg-slate-900/80 backdrop-blur-sm">
                <!-- Rotující glóbus místo mozku -->
                <i data-lucide="globe" class="w-14 h-14 text-emerald-500 spin mb-5 drop-shadow-md"></i>
                <p class="text-slate-600 dark:text-slate-300 font-bold tracking-wider text-sm uppercase">Prozkoumávám atlas světa...</p>
            </div>
            <noscript>
                <p class="p-8 text-center text-slate-600">Geo Kvíz potřebuje zapnutý JavaScript.</p>
            </noscript>
        </main>
    </div>
</body>
</html>
